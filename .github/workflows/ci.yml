name: Success Coach Chatbot CI/CD

on:
  push:
    branches: [ main, initial_commit ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Build and Verify the Next.js Frontend
  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd apps/frontend
          npm ci

      - name: Run ESLint
        run: |
          cd apps/frontend
          npm run lint

      - name: TypeScript Type-Check
        run: |
          cd apps/frontend
          npx tsc --noEmit

      - name: Build Production Web App
        run: |
          cd apps/frontend
          npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://dc-success-coach.vercel.app"

  # Job 2: Test and Lint the Python Data Layer
  python-tests:
    name: Python Data Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv (Python Package Manager)
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        run: |
          cd apps/data
          uv python install

      - name: Install Python Dependencies
        run: |
          cd apps/data
          uv sync --all-extras --dev

      - name: Run Ruff Linter
        run: |
          cd apps/data
          uv run ruff check .

      - name: Run Pytest Suite
        run: |
          cd apps/data
          uv run pytest
